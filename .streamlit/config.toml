# Claim Ledger -- Streamlit theme (task 18.5 restyle)
#
# Palette: sharp, futuristic, black and gray with a mint green highlight.
# One accent (mint) carries all interactive emphasis; status meaning is NEVER
# carried by color alone (every badge also shows a text label + a symbol, see
# app.inject_css()). Defined once here and mirrored as CSS variables in app.py.
#
# Contrast (WCAG AA, >= 4.5:1 for normal text):
#   textColor #E8E8EA on backgroundColor #0A0A0B          -> ~16.6:1 (AAA)
#   textColor #E8E8EA on secondaryBackgroundColor #121214 -> ~15.5:1 (AAA)
#   mint #3EF2B0 on #0A0A0B                                -> ~13.9:1 (AAA)
# Keyboard focus outlines are preserved/strengthened in CSS (mint, never removed).
# This file is written as UTF-8 WITHOUT a BOM.

[theme]
base = "dark"
primaryColor = "#3EF2B0"             # mint accent -- the single interactive emphasis
backgroundColor = "#0A0A0B"          # near-black page canvas
secondaryBackgroundColor = "#121214" # cards, sidebar, inputs
textColor = "#E8E8EA"                # off-white, high contrast on both backgrounds
font = "monospace"                   # mono-forward; body uses Inter via injected CSS

[server]
headless = true